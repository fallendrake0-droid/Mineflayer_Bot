openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: MineControl API — control a Mineflayer Minecraft bot
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Minecraft bot operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/connect:
    post:
      operationId: connectBot
      tags: [bot]
      summary: Connect bot to a Minecraft server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConnectRequest"
      responses:
        "200":
          description: Bot connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
        "400":
          description: Invalid request or already connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/disconnect:
    post:
      operationId: disconnectBot
      tags: [bot]
      summary: Disconnect the bot
      responses:
        "200":
          description: Bot disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"
        "400":
          description: Bot not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get current bot status
      responses:
        "200":
          description: Current bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/command:
    post:
      operationId: executeBotCommand
      tags: [bot]
      summary: Execute a bot command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotCommandRequest"
      responses:
        "200":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: Bot not connected or invalid command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/control:
    post:
      operationId: sendBotControl
      tags: [bot]
      summary: Set manual movement / look controls (remote-control pad)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotControlRequest"
      responses:
        "200":
          description: Controls applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: Bot not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/settings:
    get:
      operationId: getBotSettings
      tags: [bot]
      summary: Get bot automation settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
    put:
      operationId: updateBotSettings
      tags: [bot]
      summary: Update bot automation settings (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/logs:
    get:
      operationId: getBotLogs
      tags: [bot]
      summary: Get recent bot activity logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Recent bot logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLogsResponse"
    delete:
      operationId: clearBotLogs
      tags: [bot]
      summary: Clear all bot activity logs
      responses:
        "200":
          description: Logs cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  /bot/inventory:
    get:
      operationId: getBotInventory
      tags: [bot]
      summary: Get current bot inventory
      responses:
        "200":
          description: Bot inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInventoryResponse"

  /bot/ai/goal:
    post:
      operationId: aiGoal
      tags: [bot]
      summary: Give the AI brain a natural-language goal (starts asynchronously)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGoalRequest"
      responses:
        "200":
          description: Goal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: AI not configured/enabled, bot disconnected, or a goal is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/ai/stop:
    post:
      operationId: aiStop
      tags: [bot]
      summary: Stop the current AI goal and autopilot
      responses:
        "200":
          description: AI stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  /bot/ai/autopilot:
    post:
      operationId: setAiAutopilot
      tags: [bot]
      summary: Turn AI autopilot (self-chosen goals) on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAutopilotRequest"
      responses:
        "200":
          description: Updated AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "400":
          description: AI not configured/enabled or bot disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/ai/status:
    get:
      operationId: getAiStatus
      tags: [bot]
      summary: AI brain status (config, current goal, usage)
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"

  /bot/ai/skills:
    get:
      operationId: listAiSkills
      tags: [bot]
      summary: List skills the AI has written for itself
      responses:
        "200":
          description: Skill summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSkillListResponse"

  /bot/ai/skills/{name}:
    get:
      operationId: getAiSkill
      tags: [bot]
      summary: Get one AI skill including its source code
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSkill"
        "404":
          description: No such skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAiSkill
      tags: [bot]
      summary: Delete an AI skill
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "404":
          description: No such skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/ai/config:
    get:
      operationId: getAiConfig
      tags: [bot]
      summary: Get public AI provider config (never returns the API key)
      responses:
        "200":
          description: Public AI config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPublicConfig"
    put:
      operationId: updateAiConfig
      tags: [bot]
      summary: Update AI provider config (API key is write-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiConfigUpdate"
      responses:
        "200":
          description: Updated public AI config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPublicConfig"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BotConnectRequest:
      type: object
      properties:
        host:
          type: string
          description: Minecraft server hostname or IP
        port:
          type: integer
          description: Server port (default 25565)
          default: 25565
        username:
          type: string
          description: Bot username (offline-mode servers)
        version:
          type: string
          description: 'Minecraft version (e.g. "1.20.1") or "auto" to auto-detect'
          default: "auto"
        owner:
          type: string
          description: Your in-game username — whitelisted to run !chat commands
      required:
        - host
        - username

    BotStatus:
      type: object
      properties:
        connected:
          type: boolean
        connectionState:
          type: string
          enum:
            - disconnected
            - connecting
            - connected
            - reconnecting
        username:
          type: string
        host:
          type: string
        port:
          type: integer
        version:
          type: string
        currentTask:
          type: string
        taskDetail:
          type: string
        health:
          type: number
        food:
          type: number
        foodSaturation:
          type: number
        xpLevel:
          type: integer
        xpProgress:
          type: number
          description: Progress to next XP level (0–1)
        ping:
          type: integer
        position:
          $ref: "#/components/schemas/Position"
        dimension:
          type: string
        gameMode:
          type: string
        timeOfDay:
          type: string
          description: day | sunset | night | sunrise
        isRaining:
          type: boolean
        heldItem:
          type: string
        facing:
          type: string
          description: Cardinal direction the bot is facing (N, NE, E, …)
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInfo"
        uptimeSeconds:
          type: integer
        reconnectAttempts:
          type: integer
        viewerEnabled:
          type: boolean
        viewerPath:
          type: string
        viewerPort:
          type: integer
        stats:
          $ref: "#/components/schemas/BotStats"
      required:
        - connected

    PlayerInfo:
      type: object
      properties:
        username:
          type: string
        ping:
          type: integer
        distance:
          type: number
          description: Distance in blocks, absent when the player entity is not loaded
      required:
        - username

    BotStats:
      type: object
      properties:
        blocksMined:
          type: integer
        logsChopped:
          type: integer
        treesChopped:
          type: integer
        mobsKilled:
          type: integer
        itemsCollected:
          type: integer
        deaths:
          type: integer
        distanceWalked:
          type: number
          description: Metres travelled this session
        sessionStartedAt:
          type: string
          description: ISO timestamp of when the current session started

    Position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
        - x
        - y
        - z

    BotCommandRequest:
      type: object
      properties:
        command:
          type: string
          enum:
            - follow
            - stop
            - killMobs
            - mine
            - dropItems
            - buildBase
            - climb
            - hit
            - pullLever
            - hitPlayer
            - chopTree
            - goto
            - chat
            - eat
            - sleep
            - guard
            - collectItems
            - depositItems
            - wander
            - equipItem
            - useItem
            - tossItem
        target:
          type: string
          description: Target player name or entity name (follow, hit, hitPlayer, dropItems)
        resource:
          type: string
          enum:
            - coal
            - iron
            - copper
            - gold
            - redstone
            - lapis
            - diamond
            - emerald
            - stone
            - obsidian
            - ancient_debris
          description: Resource type (for mine command)
        treeType:
          type: string
          enum:
            - oak
            - birch
            - spruce
            - jungle
            - acacia
            - dark_oak
            - mangrove
            - cherry
            - any
          description: Tree type to chop (for chopTree command, defaults to any)
        x:
          type: number
          description: X coordinate (for goto)
        y:
          type: number
          description: Y coordinate (for goto)
        z:
          type: number
          description: Z coordinate (for goto)
        message:
          type: string
          description: Chat message or /server command (for chat)
        slot:
          type: integer
          description: Inventory slot (for equipItem, useItem, tossItem)
        count:
          type: integer
          description: Amount — items to mine/toss, or blocks to climb
        size:
          type: integer
          description: Outer size of the shelter in blocks (for buildBase, 3–15)
      required:
        - command

    BotControlRequest:
      type: object
      properties:
        forward:
          type: boolean
        back:
          type: boolean
        left:
          type: boolean
        right:
          type: boolean
        jump:
          type: boolean
        sprint:
          type: boolean
        sneak:
          type: boolean
        yawDelta:
          type: number
          description: Relative yaw change in radians (positive = turn left)
        pitchDelta:
          type: number
          description: Relative pitch change in radians (positive = look down)

    BotSettings:
      type: object
      properties:
        autoEat:
          type: boolean
          description: Automatically eat when hungry
        autoEatThreshold:
          type: integer
          description: Eat when food level is at or below this value (0–20)
        autoEquipArmor:
          type: boolean
          description: Automatically wear the best armor in inventory
        autoReconnect:
          type: boolean
          description: Reconnect automatically after an unexpected disconnect
        maxReconnectAttempts:
          type: integer
          description: Max auto-reconnect attempts (0 = unlimited)
        antiAfk:
          type: boolean
          description: Occasionally look around / hop while idle so servers don't kick for AFK
        autoDefend:
          type: boolean
          description: Fight back when attacked while idle
        autoCollectDrops:
          type: boolean
          description: Walk over and pick up drops after mining/chopping/combat
        chatCommandsEnabled:
          type: boolean
          description: Allow !commands from in-game chat
        chatCommandOwners:
          type: array
          items:
            type: string
          description: Usernames allowed to use chat commands (empty = everyone)
        viewerEnabled:
          type: boolean
          description: Start the prismarine-viewer live view when connected
        viewerFirstPerson:
          type: boolean
          description: First-person camera (true) or orbit camera (false)
        aiEnabled:
          type: boolean
          description: Enable the LLM-powered AI brain (goals, autopilot, self-written skills)
        aiChatEnabled:
          type: boolean
          description: Let owners talk to the AI brain with plain in-game chat (not just !ai)

    CommandResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    AiGoalRequest:
      type: object
      properties:
        goal:
          type: string
          description: Natural-language goal for the AI brain (e.g. "mine 10 iron and bring it to me")
      required:
        - goal

    AiAutopilotRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Turn AI autopilot (self-chosen goals) on or off
      required:
        - enabled

    AiConfigUpdate:
      type: object
      description: Partial AI provider config. apiKey is write-only (stored server-side, never returned). Empty string clears a value.
      properties:
        apiKey:
          type: string
        baseUrl:
          type: string
          description: OpenAI-compatible API base URL (default is Google Gemini's)
        model:
          type: string
          description: Model name (e.g. gemini-2.5-flash)

    AiPublicConfig:
      type: object
      properties:
        hasKey:
          type: boolean
          description: Whether an API key is configured (the key itself is never returned)
        baseUrl:
          type: string
        model:
          type: string
      required:
        - hasKey
        - baseUrl
        - model

    AiUsage:
      type: object
      properties:
        calls:
          type: integer
        promptTokens:
          type: integer
        completionTokens:
          type: integer
      required:
        - calls
        - promptTokens
        - completionTokens

    AiStatus:
      type: object
      properties:
        configured:
          type: boolean
        enabled:
          type: boolean
        chatEnabled:
          type: boolean
        model:
          type: string
        baseUrl:
          type: string
        autopilot:
          type: boolean
        goalActive:
          type: boolean
        currentGoal:
          type: string
        lastOutcome:
          type: string
        usage:
          $ref: "#/components/schemas/AiUsage"
        skillCount:
          type: integer
      required:
        - configured
        - enabled
        - chatEnabled
        - model
        - baseUrl
        - autopilot
        - goalActive
        - usage
        - skillCount

    AiSkillSummary:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        runs:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        updatedAt:
          type: string
      required:
        - name
        - description
        - runs
        - successes
        - failures
        - updatedAt

    AiSkill:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        code:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        runs:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
      required:
        - name
        - description
        - code
        - createdAt
        - updatedAt
        - runs
        - successes
        - failures

    AiSkillListResponse:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AiSkillSummary"
      required:
        - skills

    BotLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
      required:
        - logs

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
        level:
          type: string
          enum:
            - info
            - warn
            - error
            - success
        message:
          type: string
        category:
          type: string
          enum:
            - system
            - chat
            - combat
            - task
            - connection
            - ai
      required:
        - timestamp
        - level
        - message

    BotInventoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        selectedSlot:
          type: integer
          description: Currently selected hotbar slot (36–44)
        heldItem:
          type: string
          description: Name of the item currently held
      required:
        - items

    InventoryItem:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        count:
          type: integer
        slot:
          type: integer
        isArmor:
          type: boolean
        isTool:
          type: boolean
        isFood:
          type: boolean
        category:
          type: string
          enum:
            - armor
            - weapon
            - tool
            - food
            - block
            - other
        durability:
          type: number
          description: Remaining durability 0–1, absent when not damageable
      required:
        - name
        - count
        - slot
        - isArmor
        - isTool
        - isFood
        - category

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
